spring:
  application:
    name: api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: game
  flyway:
    schemas: game
  mvc:
    problemdetails:
      enabled: true

app:
  supabase-url: ${SUPABASE_URL}
  jwt-audience: ${APP_JWT_AUDIENCE:authenticated}
  admin-emails: ${APP_ADMIN_EMAILS:}

management:
  endpoints:
    web:
      exposure:
        include: health
