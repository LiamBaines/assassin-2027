# Secrets (set with `fly secrets set`, never committed): SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, SUPABASE_URL, APP_ADMIN_EMAILS.
app = "assassin-2027-api"
primary_region = "fra" # next to Supabase eu-central-1

[build]
  dockerfile = "Dockerfile"

[env]
  APP_JWT_AUDIENCE = "authenticated"
  # The Supabase session pooler caps client connections, so keep the pool small.
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE = "5"

# Exactly one always-on machine: the join-code rate limiter is in memory.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
