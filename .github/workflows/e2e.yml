name: E2E

on:
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Local ES256 key, so local tokens are signed like production (JWKS).
      - name: Generate local signing key
        run: ./scripts/gen-local-signing-key.sh

      # Starts Supabase, then Playwright starts the API and `next build && next start`.
      - name: Run e2e
        run: ./scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
