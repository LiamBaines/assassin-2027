name: API

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml

      # Unit tests plus the Testcontainers ITs (Docker is available on ubuntu runners).
      - name: Verify
        working-directory: api
        run: ./mvnw -B verify
